trigger:
  branches:
    include:
      - main

pr: none

pool:
  vmImage: ubuntu-latest

steps:
  - task: NodeTool@0
    displayName: Use Node.js 20
    inputs:
      versionSpec: 20.x

  - script: npm ci
    displayName: Install dependencies

  - script: npm run build:prod
    displayName: Build production extension

  - script: npm run validate
    displayName: Validate generated extension files

  - script: npm run package:prod
    displayName: Create Chrome Web Store ZIP

  - task: PublishPipelineArtifact@1
    displayName: Publish Chrome Web Store package
    inputs:
      targetPath: release
      artifact: chrome-store-package
      publishLocation: pipeline
