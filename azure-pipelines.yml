name: CleanIn

trigger:
  branches:
    include:
      - V*.*.*

pr: none

stages:
  - stage: BuildDist
    displayName: Build Dist
    jobs:
      - job: Build
        displayName: Build dist package
        pool:
          vmImage: ubuntu-latest
        steps:
          - task: NodeTool@0
            displayName: Use Node.js 20
            inputs:
              versionSpec: 20.x

          - script: |
              branch="${BUILD_SOURCEBRANCH#refs/heads/}"
              if ! printf '%s\n' "$branch" | grep -Eq '^V[0-9]+\.[0-9]+\.[0-9]+$'; then
                echo "This pipeline only runs for release branches named VX.Y.Z, for example V1.3.3."
                exit 1
              fi

              manifest_version="$(node -e "console.log(JSON.parse(require('fs').readFileSync('dist/manifest.json', 'utf8')).version)")"
              branch_version="${branch#V}"
              if [ "$manifest_version" != "$branch_version" ]; then
                echo "dist/manifest.json version ${manifest_version} does not match branch ${branch}."
                exit 1
              fi

              echo "Validated release branch: ${branch}"
            displayName: Validate release branch version

          - script: |
              python3 -m json.tool dist/manifest.json >/dev/null
              node --check dist/content.js
              node --check dist/background.js
              node --check dist/sidepanel/sidepanel.js
              git diff --check
            displayName: Validate extension files

          - script: |
              version="$(node -e "console.log(JSON.parse(require('fs').readFileSync('dist/manifest.json', 'utf8')).version)")"
              cd dist
              zip -r "$(Build.ArtifactStagingDirectory)/cleanin-chrome-store-v${version}.zip" . -x "*.DS_Store" "__MACOSX/*"
            displayName: Create Chrome Web Store ZIP

          - task: PublishPipelineArtifact@1
            displayName: Publish Chrome Web Store ZIP
            inputs:
              targetPath: $(Build.ArtifactStagingDirectory)
              artifact: chrome-store-zip
              publishLocation: pipeline

  - stage: UploadToChromeStore
    displayName: Upload to Chrome Store
    dependsOn: BuildDist
    jobs:
      - job: ManualUpload
        displayName: Upload to Chrome Store
        pool: server
        timeoutInMinutes: 4320
        steps:
          - task: ManualValidation@0
            displayName: Confirm Chrome Store upload
            timeoutInMinutes: 4320
            inputs:
              notifyUsers: ''
              instructions: |
                Download the chrome-store-zip artifact from this run.
                Upload the cleanin-chrome-store-v*.zip package to the Chrome Developer Store.
                Resume this job after the package has been uploaded successfully.
              onTimeout: reject
