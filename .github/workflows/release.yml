name: Build Chrome Web Store package

on:
  push:
    branches:
      - main
      - codex/dev
  pull_request:
    branches:
      - main
      - codex/dev
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    env:
      CLEANIN_PRODUCTION: '1'
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-node@v6
        with:
          node-version: '24'

      - uses: pnpm/action-setup@v6

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.4'

      - name: Install, test, and build
        run: |
          pnpm install --frozen-lockfile
          pnpm test
          pnpm run typecheck
          pnpm run build

      - name: Validate and package the extension
        id: package
        run: |
          cd dist
          version=$(node -p "require('./manifest.json').version")
          test "$version" = "$(node -p "require('../public/manifest.json').version")"
          test "$version" = "$(node -p "require('../package.json').version")"
          find . -type f -name '*.js' -print0 | xargs -0 -n1 node --check
          git -C "$GITHUB_WORKSPACE" diff --check
          archive="$RUNNER_TEMP/cleanin-chrome-store-v$version.zip"
          zip -r "$archive" . -x '*.DS_Store' '__MACOSX/*' '*.map'
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "archive=$archive" >> "$GITHUB_OUTPUT"

      - name: Upload Chrome Web Store ZIP
        uses: actions/upload-artifact@v7
        with:
          name: cleanin-chrome-store-v${{ steps.package.outputs.version }}
          path: ${{ steps.package.outputs.archive }}
          archive: false
          if-no-files-found: error
